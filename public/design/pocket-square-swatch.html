<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ted Leung — Pocket-square motif study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px; background: #f8f8f4; color: #263c34; font-family: Arial, sans-serif; }
    main { max-width: 1100px; margin: auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 24px; }
    h1 { margin: 0; font: 400 clamp(30px, 4vw, 48px)/1.1 Georgia, serif; letter-spacing: -1px; }
    a { color: inherit; font-size: 14px; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #304840; outline-offset: 6px; }
    .study { display: grid; grid-template-columns: 1fr 2fr; border: 1px solid #dfe3dc; }
    figure { margin: 0; min-width: 0; }
    .drawing { border-right: 1px solid #dfe3dc; }
    .drawing img { display: block; width: 100%; height: 460px; padding: 38px 24px; object-fit: contain; }
    .repeat { position: relative; height: 460px; overflow: hidden; }
    .repeat::before { content: ""; position: absolute; inset: 0; background: url("../images/pocket-square-filigree.svg") repeat -40px -30px / 360px auto; opacity: .18; }
    figcaption { border-top: 1px solid #dfe3dc; padding: 20px 24px; font-size: 13px; line-height: 1.6; }
    figcaption span { display: block; margin-top: 4px; color: #5e6b63; }
    .note { max-width: 650px; margin: 24px 0 0; color: #5e6b63; font-size: 15px; line-height: 1.65; }
    @media (max-width: 640px) {
      body { padding: 28px 20px; }
      header { align-items: flex-start; flex-direction: column; gap: 16px; }
      .study { grid-template-columns: 1fr; }
      .drawing { border-right: 0; border-bottom: 1px solid #dfe3dc; }
      .drawing img { height: 340px; }
      .repeat { height: 340px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>The pocket-square study.</h1>
      <a href="/">See it on Ted’s site &#8594;</a>
    </header>
    <div class="study">
      <figure class="drawing">
        <img src="../images/pocket-square-filigree.svg" alt="A tapered flourish of fine, nested curves inspired by the coloured bands in Ted’s pocket square.">
        <figcaption>The drawing<span>Two turning flourishes form the repeating tile.</span></figcaption>
      </figure>
      <figure>
        <div class="repeat" role="img" aria-label="The same flourish repeated in pale green on warm ivory."></div>
        <figcaption>The repeat<span>Green on warm ivory. Shown at the hero’s maximum intensity.</span></figcaption>
      </figure>
    </div>
    <p class="note">An interpretation of the pattern visible in Ted’s pocket square. On the site, the linework fades through the open space around the introduction, leaving the portrait and words in focus.</p>
  </main>
</body>
</html>
